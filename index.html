function nav(){return ['dashboard','activity','split','plan'].map(p=>`<button data-page="${p}" class="nav-item ${page===p?'active':''}" ${page===p?'aria-current="page"':''}>${icon(p)}<span>${p==='plan'?'My Plan':p==='split'?'My Workout Split':p[0].toUpperCase()+p.slice(1)}</span>${page===p?'<i></i>':''}</button>`).join('')}
function progress(){return today()<state.start?0:Math.min(span(state.start,today()<end(state)?today():end(state)).length,state.duration)}
function shell(body){return `<aside class="sidebar"><div class="brand">${logo()}<div><b>WINTER ARC</b><small>BY OVIRO</small></div></div><p class="eyebrow nav-label">YOUR DAILY PRACTICE</p><nav aria-label="Main">${nav()}</nav><div class="sidebar-bottom"><div class="season-mark">W<span>/</span>A</div><p>SHOW UP.<br>EVERY DAY.</p><small>A little stronger. A little closer.</small><div class="local-label"><span></span> Saved on this device</div></div></aside><div class="workspace"><header class="topbar"><div><span class="orange-dot"></span> THE WINTER ARC <span class="edition">/ YOUR SEASON OF CHANGE</span></div><span class="today-label">${pretty(today(),{weekday:'short',month:'short',day:'numeric'})}</span><span class="avatar">${esc(state.name[0].toUpperCase())}</span></header><main>${body}<footer><span>CONSISTENCY OVER PERFECTION.</span><span>OVIRO © ${new Date().getFullYear()}</span></footer></main></div><nav class="bottom-nav" aria-label="Mobile navigation">${nav()}</nav>`}
function render(){if(!state){renderOnboarding();return}$('#app').innerHTML=shell(page==='dashboard'?dashboard():page==='activity'?activity():page==='split'?workoutSplit():plan());bind();}
function heading(kicker,title,sub,extra=''){return `<div class="page-heading"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1><p class="muted">${sub}</p></div>${extra}</div>`}
function ring(rate){return `<div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-track" cx="100" cy="100" r="86"/><circle class="ring-value" cx="100" cy="100" r="86" pathLength="100" stroke-dasharray="${rate} 100"/></svg><div><strong>${rate}<span>%</span></strong><small>CONSISTENCY</small></div></div>`}
function dashboard(){const m=metrics(state),t=today(),hour=new Date().getHours(),g=hour<12?'morning':hour<17?'afternoon':'evening';const week=add(t,-((date(t).getDay()+6)%7));const wm=metrics(state,t,week,add(week,6));const finished=t>end(state),upcoming=t<state.start,done=state.entries[t]?.complete;
return heading(`GOOD ${g.toUpperCase()}, ${esc(state.name.toUpperCase())}`,"Let’s keep the momentum.",'Every session is a promise kept to yourself.',`<div class="day-pill"><span class="orange-dot"></span>${upcoming?'STARTS '+pretty(state.start):finished?'ARC COMPLETE':`DAY <b>${progress()}</b> / ${state.duration}`}</div>`)+`<div class="dashboard-grid"><section class="card hero"><div class="card-top"><p class="eyebrow">THE BIG PICTURE</p><span class="tag">${state.duration}-DAY ARC</span></div><div class="hero-inner">${ring(m.rate)}<div class="hero-copy"><span class="mini-label">YOUR CONSISTENCY</span><h2>${m.completed?'You’re building<br>something good.':'Great things start<br>with showing up.'}</h2><p>${m.expected?`${m.completed} of ${m.expected} scheduled sessions complete.`:'Your next chapter starts with one session.'}<br>Small efforts. Lasting change.</p></div></div><div class="hero-foot"><span>${icon('check')} Progress, not perfection.</span><span>${pretty(state.start)} — ${pretty(end(state))}</span></div></section><section class="card streak"><div class="card-top"><p class="eyebrow">KEEP THE FIRE ALIVE</p>${icon('fire','accent')}</div><div class="streak-number">${m.streak}<span>sessions</span></div><h3>Workout streak</h3><p class="muted">${m.streak?'One session at a time. Keep going.':'Your first session lights the spark.'}</p><div class="streak-dots">${Array.from({length:7},(_,i)=>`<span class="${i<Math.min(m.streak,7)?'lit':''}">${i<Math.min(m.streak,7)?icon('check'):'·'}</span>`).join('')}</div><small>Rest days protect your momentum.</small></section><div class="stats-row"><section class="card stat"><span class="stat-icon">${icon('check')}</span><div><p class="eyebrow">COMPLETED SESSIONS</p><strong>${m.total.toString().padStart(2,'0')}</strong><small>including bonus workouts</small></div></section><section class="card stat"><span class="stat-icon">${icon('activity')}</span><div><p class="eyebrow">THIS WEEK</p><strong>${wm.rate}<em>%</em></strong><small>${wm.completed} of ${wm.expected} elapsed scheduled sessions</small></div></section><section class="card stat"><span class="stat-icon">${icon('plan')}</span><div><p class="eyebrow">YOUR ARC</p><strong>${progress()}<em> / ${state.duration}</em></strong><small>${upcoming?'Your season is coming':finished?'A season to be proud of':'days of becoming stronger'}</small></div></section></div><section class="card calendar-card"><div class="card-top"><div><p class="eyebrow">ONE DAY AT A TIME</p><h3>Activity calendar</h3></div><button class="text-btn" data-page="activity">View activity ${icon('arrow')}</button></div>${calendar(false)}</section><section class="card weekly"><div class="card-top"><div><p class="eyebrow">BUILD YOUR RHYTHM</p><h3>This week</h3></div><span class="tag">${wm.total} DONE</span></div>${weekly(week)}<p class="chart-caption"><i></i> Completed <i class="outlined"></i> Scheduled <span>One bar = one session</span></p></section><section class="today-card ${done?'done':''}"><div class="today-icon">${icon(done?'check':planned(state,t)?'plus':'fire')}</div><div><p class="eyebrow">${upcoming?'YOUR NEXT CHAPTER':finished?'THE FINISH LINE':done?'PROMISE KEPT':planned(state,t)?'TODAY’S COMMITMENT':'RECOVERY DAY'}</p><h3>${upcoming?'Your arc is almost here.':finished?'Take a moment. You showed up.':done?'You showed up. That matters.':planned(state,t)?'Make time for your future self.':'Rest is part of the process.'}</h3><p>${done?'Your progress is saved. See you at the next session.':planned(state,t)?'One workout. One step closer.':'An optional bonus session won’t change your consistency rate.'}</p></div>${inArc(state,t)?`<button class="primary" id="complete" ${done?'disabled':''}>${done?'WORKOUT COMPLETE':planned(state,t)?'COMPLETE TODAY’S WORKOUT':'LOG A BONUS WORKOUT'} ${icon(done?'check':'arrow')}</button>`:`<button class="secondary" data-page="plan">View my plan ${icon('arrow')}</button>`}</section></div>`}
function calendar(large){const first=month+'-01',d=date(first),last=localDate(new Date(d.getFullYear(),d.getMonth()+1,0,12));const offset=(d.getDay()+6)%7;return `<div class="month-heading"><b>${pretty(first,{month:'long',year:'numeric'})}</b><div><button class="icon-btn" data-month="-1" aria-label="Previous month">${icon('left')}</button><button class="icon-btn" data-month="1" aria-label="Next month">${icon('right')}</button></div></div><div class="calendar ${large?'large':''}">${[1,2,3,4,5,6,0].map(n=>`<span class="weekday">${DAYS[n]}</span>`).join('')}${'<span></span>'.repeat(offset)}${span(first,last).map(day=>{const st=status(state,day);return `<button class="date-cell ${st} ${day===today()?'is-today':''}" data-day="${day}" ${day>today()||!inArc(state,day)?'disabled':''} aria-label="${pretty(day,{month:'long',day:'numeric',year:'numeric'})}: ${st}${day===today()?', today':''}"><span>${date(day).getDate()}</span>${large?`<small>${({complete:'Completed',bonus:'Bonus',missed:'Missed',rest:'Rest',pending:'Today',future:planned(state,day)?'Planned':'Rest',outside:'—'})[st]}</small>`:st==='complete'||st==='bonus'?'<i>✓</i>':''}</button>`}).join('')}</div><div class="legend"><span><i class="complete"></i>Completed / bonus</span><span><i class="missed"></i>Missed</span><span><i class="rest"></i>Rest</span><span><i class="future"></i>Future</span><span><i class="today"></i>Today</span></div>`}
function weekly(start){return `<div class="bars">${span(start,add(start,6)).map(d=>{const yes=state.entries[d]?.complete,pl=planned(state,d);return `<div class="bar-group"><span class="bar-value">${yes?'1':pl?'0':'—'}</span><div class="bar-track"><div class="bar ${yes?'filled':pl?'scheduled':'rest-bar'}" title="${DAYS[date(d).getDay()]}: ${yes?'completed':pl?'scheduled':'rest'}"></div></div><span class="${d===today()?'accent':''}">${DAYS[date(d).getDay()].slice(0,1)}</span></div>`}).join('')}</div>`}
function activity(){const first=month+'-01',last=localDate(new Date(date(first).getFullYear(),date(first).getMonth()+1,0,12)),m=metrics(state,today(),first,last);return heading('YOUR JOURNEY','Every day tells a story.','A record of the work. A reminder of what you’re becoming.')+`<div class="activity-layout"><section class="card">${calendar(true)}</section><div class="activity-side"><section class="card"><p class="eyebrow">THIS MONTH</p><div class="month-stat">${m.rate}<span>%</span></div><h3>Monthly consistency</h3><p class="muted">${m.completed} of ${m.expected} elapsed scheduled workouts completed.</p><div class="thin-progress"><i style="width:${m.rate}%"></i></div></section><section class="card"><p class="eyebrow">MAKE IT YOURS</p><h3>The details matter.</h3><p class="muted">Select a past day or today to update a workout, add a note, or reflect on your progress.</p><p class="helper">A missed day is information, not a verdict. Your next session is a fresh start.</p></section></div></div>`}
function formFields(s){const days=s?.schedules.at(-1).days||[1,3,5,6];return `<label>First name<input name="name" autocomplete="given-name" required maxlength="40" placeholder="What should we call you?" value="${esc(s?.name||'')}"></label><fieldset><legend>Choose your arc</legend><div class="duration-options">${[30,60,90].map(n=>`<label class="choice"><input type="radio" name="duration" value="${n}" ${(s?.duration||90)===n?'checked':''}><span><b>${n}</b> days</span></label>`).join('')}</div></fieldset><label>Challenge starts<input type="date" name="start" required min="1900-01-01" max="2100-01-01" value="${s?.start||today()}"></label><fieldset><legend>Your workout days</legend><div class="day-options">${[1,2,3,4,5,6,0].map(n=>`<label class="day-choice"><input type="checkbox" name="days" value="${n}" ${days.includes(n)?'checked':''}><span>${DAYS[n]}</span></label>`).join('')}</div><p class="helper">Choose at least one day. Recovery days are part of the plan.</p></fieldset>`}

function workoutSplit(){
 const split=state.split||{name:'',days:Array.from({length:7},()=>({title:'',details:''}))};
 const names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 return heading('YOUR TRAINING BLUEPRINT','My Workout Split','Give every session a purpose. Build a week that works for you.')+
 '<form id="split-form" class="split-form"><section class="card split-intro"><div><p class="eyebrow accent">YOUR ROUTINE</p><h3>A plan worth showing up for.</h3><p class="muted">Add a focus and exercises for each day. Use the details for sets, reps, or any reminders you need.</p></div><label>Split name <span class="muted">(optional)</span><input name="split-name" maxlength="80" placeholder="e.g. Push / Pull / Legs" value="'+esc(split.name)+'"></label></section><div class="split-grid">'+[1,2,3,4,5,6,0].map(n=>{
 const day=split.days[n];return '<section class="card split-day"><div class="card-top"><h3>'+names[n]+'</h3><span class="tag">'+(schedule(state,today()<state.start?state.start:today()).includes(n)?'WORKOUT DAY':'RECOVERY DAY')+'</span></div><label>Workout focus<input name="title-'+n+'" maxlength="80" placeholder="e.g. '+(n===1?'Push — chest, shoulders, triceps':n===2?'Pull — back and biceps':n===3?'Legs and core':'Rest, mobility, or your workout')+'" value="'+esc(day.title)+'"></label><label>Exercises & notes<textarea name="details-'+n+'" rows="4" maxlength="2000" placeholder="Bench press · 3 × 8&#10;Shoulder press · 3 × 10&#10;Add your own exercises…">'+esc(day.details)+'</textarea></label></section>';
 }).join('')+'</div><div class="split-save"><p class="helper">This is your workout reference. Change scheduled workout days in My Plan.</p><button class="primary" type="submit">SAVE MY SPLIT '+icon('check')+'</button></div></form>';
}

function plan(){return heading('BUILT AROUND YOU','Your arc. Your rules.','A realistic plan is a plan you’ll return to.')+`<div class="plan-layout"><section class="card"><div class="card-top"><h3>Make it personal</h3><span class="tag">MY PLAN</span></div><form id="plan-form">${formFields(state)}<div class="policy"><b>Your history stays yours.</b><p>Workout-day changes take effect tomorrow (or your start date, if later). Previous days keep their original schedule. Changing the start date or duration starts a fresh arc after confirmation.</p></div><button class="primary" type="submit">SAVE MY PLAN ${icon('check')}</button></form></section><div class="plan-side"><section class="card"><p class="eyebrow">THE LONG GAME</p><h3>${progress()} down. ${state.duration-progress()} to go.</h3><div class="thin-progress"><i style="width:${progress()/state.duration*100}%"></i></div><p class="muted">${pretty(state.start)} — ${pretty(end(state))}</p><p class="helper">Consistency includes today’s scheduled session. A pending session today won’t break your streak.</p></section><section class="card"><p class="eyebrow">KEEP YOUR PROGRESS SAFE</p><h3>Your data, in your hands.</h3><p class="muted">Saved in this browser, on this device. No account or cross-device sync.</p><button class="secondary full" id="export">${icon('download')} Export backup</button><button class="text-btn full" id="import">Restore from backup ${icon('arrow')}</button><input id="import-file" type="file" accept=".json,application/json" hidden></section><section class="card"><h3>A fresh start</h3><p class="muted">Restart with a clean calendar. Export your current arc first if you’d like to keep it.</p><button class="text-btn danger" id="restart">Restart my challenge ${icon('arrow')}</button></section></div></div>`}
function renderOnboarding(){if(welcome){$('#app').innerHTML=`<div class="welcome"><header>${logo()}<span class="eyebrow">OVIRO / WINTER ARC</span><span class="welcome-edition">YOUR SEASON OF CHANGE</span></header><main class="welcome-main"><div class="welcome-copy"><p class="eyebrow accent"><span class="orange-dot"></span> SMALL EFFORTS. LASTING CHANGE.</p><h1>YOUR<br>WINTER ARC<br><span>STARTS HERE.</span></h1><p class="welcome-sub">Build consistency. Track progress.<br>Become unstoppable.</p><button class="primary" id="start">START MY ARC ${icon('arrow')}</button><p class="welcome-note">No account. No noise. Just you, showing up.</p>${storageError?`<p role="alert">${storageError}</p>`:''}</div><div class="welcome-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div><div class="arc-word">SHOW<br>UP<span>.</span></div><div class="art-caption"><span>01 — THE COMMITMENT</span><span>EVERY DAY.</span></div></div></main><footer><span>CONSISTENCY OVER PERFECTION.</span><span>BUILT FOR YOUR NEXT CHAPTER.</span></footer></div>`;$('#start').onclick=()=>{welcome=false;renderOnboarding()};return}$('#app').innerHTML=`<div class="setup"><div class="setup-intro">${logo()}<p class="eyebrow accent">LET’S MAKE THIS YOURS</p><h1>A little structure.<br>A lot of possibility.</h1><p class="muted">Build a routine that fits your life. You can adjust your plan as you go.</p><div class="setup-quote">“The goal isn’t to be perfect.<br>It’s to keep coming back.”</div></div><section class="card setup-form"><div class="card-top"><h3>Your starting point</h3><span class="tag">01 / 01</span></div><form id="setup-form">${formFields(null)}<button class="primary full">LET’S DO THIS ${icon('arrow')}</button><p class="helper">Your progress is stored privately in this browser.</p></form></section></div>`;$('#setup-form').onsubmit=e=>{e.preventDefault();const s=readForm(e.target);if(!s)return;if(persist({version:1,...s,schedules:[{from:s.start,days:s.days}],entries:{}})){month=s.start.slice(0,7);render();toast('Your winter arc starts now. Welcome, '+s.name+'.')}}}
function readForm(form){const f=new FormData(form),days=f.getAll('days').map(Number),name=String(f.get('name')).trim();if(!days.length||!name){toast('Add your name and choose at least one workout day.');return null}return {name,duration:Number(f.get('duration')),start:String(f.get('start')),days}}
function showModal(html){const d=$('#modal');d.innerHTML=html;d.showModal();d.querySelector('[data-close]')?.addEventListener('click',()=>d.close())}
function confirmAction(title,body,action,label='Confirm'){showModal(`<button class="icon-btn close" data-close aria-label="Close">${icon('close')}</button><p class="eyebrow accent">A MOMENT TO CHECK</p><h2>${title}</h2><p class="muted">${body}</p><div class="modal-actions"><button class="secondary" id="cancel">Keep my progress</button><button class="primary" id="confirm">${label}</button></div>`);$('#cancel').onclick=()=>$('#modal').close();$('#confirm').onclick=()=>{$('#modal').close();action()}}
function editDay(d){const e=state.entries[d]||{complete:false,note:''};showModal(`<button class="icon-btn close" data-close aria-label="Close">${icon('close')}</button><p class="eyebrow accent">${planned(state,d)?'SCHEDULED WORKOUT':'RECOVERY / BONUS DAY'}</p><h2>${pretty(d,{weekday:'long',month:'short',day:'numeric'})}</h2><form id="entry-form"><label class="completion-toggle"><input type="checkbox" name="complete" ${e.complete?'checked':''}> Workout completed</label><label>A note for yourself <span class="muted">(optional)</span><textarea name="note" maxlength="1000" rows="4" placeholder="How did it feel? What are you proud of?">${esc(e.note)}</textarea></label><div class="modal-actions"><button type="button" class="text-btn" id="remove-entry">Remove entry</button><button class="primary">SAVE DAY ${icon('check')}</button></div></form>`);$('#entry-form').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);const next=structuredClone(state);next.entries[d]={complete:f.has('complete'),note:String(f.get('note')).trim()};if(persist(next)){$('#modal').close();render();toast('Day updated. Every part of the journey counts.')}};$('#remove-entry').onclick=()=>confirmAction('Remove this entry?','This clears the completion and note for '+pretty(d)+'. Your scheduled day stays in the calendar.',()=>{const next=structuredClone(state);delete next.entries[d];if(persist(next)){render();toast('Entry removed.')}},'Remove entry')}
function bind(){ $('#split-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const next=structuredClone(state);next.split={name:String(f.get('split-name')).trim(),days:Array.from({length:7},(_,n)=>({title:String(f.get('title-'+n)).trim(),details:String(f.get('details-'+n)).trim()}))};if(persist(next))toast('Your workout split is saved. Make it happen.');});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{const d=date(month+'-01');d.setMonth(d.getMonth()+Number(b.dataset.month));month=localDate(d).slice(0,7);render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>editDay(b.dataset.day));$('#complete')?.addEventListener('click',()=>{const t=today();if(!inArc(state,t)||state.entries[t]?.complete)return;const next=structuredClone(state);next.entries[t]={complete:true,note:next.entries[t]?.note||''};if(persist(next)){render();toast('✓ Workout complete. Another promise kept.')}});
$('#plan-form')?.addEventListener('submit',e=>{e.preventDefault();const f=readForm(e.target);if(!f)return;const save=reset=>{const next=structuredClone(state);next.name=f.name;if(reset){next.start=f.start;next.duration=f.duration;next.entries={};next.schedules=[{from:f.start,days:f.days}]}else{const from=today()<state.start?state.start:add(today(),1);const current=schedule(state,from);if([...current].sort().join()!==[...f.days].sort().join()){next.schedules=next.schedules.filter(s=>s.from<from);next.schedules.push({from,days:f.days})}}if(persist(next)){render();toast(reset?'A fresh arc is ready.':'Plan saved. Schedule changes apply from tomorrow or your start date.')}};if(f.start!==state.start||f.duration!==state.duration)confirmAction('Start a new arc?','Changing your challenge dates clears the current workout history. Export a backup first to keep a copy.',()=>save(true),'Start new arc');else save(false)});
$('#export')?.addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='oviro-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported. Keep it somewhere safe.')});$('#import')?.addEventListener('click',()=>$('#import-file').click());$('#import-file')?.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Backup is too large. Choose a file smaller than 1 MB.');const next=validate(JSON.parse(await file.text()));confirmAction('Restore this arc?',`Replace this browser’s progress with ${esc(next.name)}’s ${next.duration}-day arc? Export your current data first if you need a copy.`,()=>{if(persist(next)){month=today().slice(0,7);render();toast('Backup restored. Welcome back.')}},'Restore backup')}catch(err){toast(err.message==='Unexpected end of JSON input'?'Invalid backup file.':err.message)}e.target.value=''});$('#restart')?.addEventListener('click',()=>confirmAction('Ready for a fresh start?','This clears your workout history and starts your challenge today. Your name, duration, and latest workout weekdays will be kept.',()=>{const next={...state,start:today(),entries:{},schedules:[{from:today(),days:state.schedules.at(-1).days}]};if(persist(next)){month=today().slice(0,7);page='dashboard';render();toast('A fresh start. You’ve got this.')}},'Restart challenge'));
}
window.addEventListener('storage',e=>{if(e.key===key&&e.newValue){try{state=validate(JSON.parse(e.newValue));render();toast('Progress updated from another tab.')}catch{toast('Another tab saved invalid data. Reload or restore a backup.')}}});let lastDay=today();setInterval(()=>{if(lastDay!==today()){lastDay=today();if(state)render()}},30000);render();

</script></body></html>
